<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in ByBata</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #F4F7FA 0%, #E8EEF5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(123, 44, 191, 0.08);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: #7B2CBF; }
    p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, #7B2CBF 0%, #5a189a 100%);
      color: #fff;
    }
    .btn-outline {
      background: #fff;
      color: #7B2CBF;
      border: 2px solid #7B2CBF;
    }
    .muted { font-size: 12px; color: #999; margin-top: 16px; display: inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://mails.bybata.com/logomail.png" alt="ByBata" class="logo">
    <h1>Open in ByBata</h1>
    <p id="msg">Opening the app…</p>
    <a id="openApp" class="btn" href="#">Open in app</a>
    <a id="playStore" class="btn btn-outline" href="https://play.google.com/store/apps/details?id=com.bybata.bybata">Get on Google Play</a>
    <a id="appStore" class="btn btn-outline" href="https://apps.apple.com/ng/app/bybata/id6779921314">Download on App Store</a>
    <a class="muted" href="/">← Back to bybata.com</a>
  </div>
  <script>
    (function () {
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.bybata.bybata';
      var APP_STORE = 'https://apps.apple.com/ng/app/bybata/id6779921314';

      function storeUrlForPlatform() {
        var ua = navigator.userAgent || '';
        if (/android/i.test(ua)) return PLAY_STORE;
        if (/iPhone|iPad|iPod/i.test(ua)) return APP_STORE;
        return null;
      }

      var params = new URLSearchParams(window.location.search);
      var path = params.get('path') || '/';
      if (!path.startsWith('/')) path = '/' + path;

      var msg = document.getElementById('msg');
      var segs = path.replace(/^\/+|\/+$/g, '').split('/');
      var kind = segs[0] || '';
      if (kind === 'invite') {
        msg.textContent = 'Opening ByBata to accept your invite…';
      } else if (kind === 'trade' || kind === 'gift' || kind === 'campaign' || kind === 'donation') {
        msg.textContent = 'Opening this listing in ByBata…';
      } else if (kind === 'profile') {
        msg.textContent = 'Opening this profile in ByBata…';
      } else if (kind === 'wallet') {
        msg.textContent = 'Opening your wallet in ByBata…';
      }

      // Build bybata:// deep link (works from in-app browser + Safari when app installed).
      var schemePath = segs.filter(Boolean).join('/');
      var schemeUrl = schemePath ? ('bybata://' + schemePath) : 'bybata://home';

      // Forward open-app query params (e.g. webDonate=success) onto the scheme URL.
      var extra = [];
      params.forEach(function (v, k) {
        if (k !== 'path') extra.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
      });
      if (extra.length) schemeUrl += '?' + extra.join('&');

      var openBtn = document.getElementById('openApp');
      openBtn.href = schemeUrl;
      openBtn.onclick = function (e) {
        e.preventDefault();
        window.location.href = schemeUrl;
      };

      setTimeout(function () { window.location.href = schemeUrl; }, 400);
      setTimeout(function () {
        if (document.visibilityState !== 'visible') return;
        var store = storeUrlForPlatform();
        if (store) {
          msg.textContent = 'ByBata is not installed. Opening the app store…';
          window.location.href = store;
          return;
        }
        msg.textContent = 'Tap “Open in app” or download ByBata below.';
      }, 3000);
    })();
  </script>
</body>
</html>
