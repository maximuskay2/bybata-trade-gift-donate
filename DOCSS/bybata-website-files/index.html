<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open in ByBata | Trade. Gift. Donate.</title>
  <meta http-equiv="refresh" content="3;url=/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #F4F7FA 0%, #E8EEF5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      border-radius: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 900;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      margin: 6px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(123, 44, 191, 0.25);
    }
    .btn-primary {
      background: linear-gradient(135deg, #7B2CBF 0%, #5a189a 100%);
      color: #fff !important;
      border: none;
    }
    .btn-secondary {
      background: #fff;
      color: #7B2CBF;
      border: 2px solid #7B2CBF;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn-group .btn { width: 100%; }
    .link-home {
      font-size: 14px;
      color: #999;
      text-decoration: none;
      margin-top: 16px;
      display: inline-block;
    }
    .link-home:hover { color: #7B2CBF; }
    .redirect-note {
      font-size: 12px;
      color: #999;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://mails.bybata.com/logomail.png" alt="ByBata" class="logo">
    <h1>Open in ByBata</h1>
    <p>If the app didn't open automatically, download ByBata to trade, gift, and donate in one secure ecosystem.</p>

    <div class="btn-group">
      <a href="https://play.google.com/store/apps/details?id=com.bybata.bybata" class="btn btn-primary">
        Get on Google Play
      </a>
      <a href="https://apps.apple.com/ng/app/bybata/id6779921314" class="btn btn-primary">
        Download on App Store
      </a>
    </div>

    <a href="/" class="link-home">← Continue to website</a>

    <p class="redirect-note">Redirecting to homepage in 3 seconds...</p>
  </div>
</body>
</html>
