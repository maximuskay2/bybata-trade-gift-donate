<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email</title>
    <style type="text/css">
        body { margin: 0; padding: 0; min-width: 100%; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #333333; background-color: #F4F7FA; }
        .code-box { background-color: #F0F2F5; border: 2px dashed #7B2CBF; color: #7B2CBF; font-family: 'Courier New', monospace; font-size: 28px; font-weight: 800; letter-spacing: 5px; text-align: center; padding: 15px; border-radius: 12px; margin: 20px 0; display: block; }
        @media (prefers-color-scheme: dark) {
            .body-bg { background-color: #121212 !important; }
            .card-bg { background-color: #1E1E1E !important; border: 1px solid #333333 !important; }
            .text-main { color: #ffffff !important; }
            .text-muted { color: #A0A0A0 !important; }
            .code-box { background-color: #2C2C2C !important; color: #BB86FC !important; border-color: #BB86FC !important; }
        }
    </style>
</head>
<body class="body-bg" style="background-color: #F4F7FA; margin: 0; padding: 0;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" class="body-bg">
        <tr>
            <td align="center" style="padding: 40px 15px;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%;">
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <img src="https://mails.bybata.com/logomail.png" alt="ByBata" width="64" height="64" style="border-radius: 16px; box-shadow: 0 8px 20px rgba(123, 44, 191, 0.15);" />
                        </td>
                    </tr>
                    <tr>
                        <td class="card-bg" bgcolor="#ffffff" style="background-color: #ffffff; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.06); overflow: hidden;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="padding: 40px; text-align: center;">
                                        <h1 class="text-main" style="margin: 0 0 10px; font-size: 26px; font-weight: 900; color: #1a1a1a;">Verify your email</h1>
                                        <p class="text-muted" style="margin: 0 0 20px; font-size: 16px; color: #666666;">Hi <strong class="text-main" style="color: #1a1a1a;">{{displayName}}</strong>, use the code below to complete your sign up for <strong>{{appName}}</strong>.</p>
                                        
                                        <div class="code-box">{{verificationLink}}</div>
                                        
                                        <p class="text-muted" style="margin: 20px 0 0; font-size: 12px; color: #999;">Code expires at: {{expiresAt}}</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-top: 30px;">
                            <p style="margin: 0; font-size: 12px; color: #999999;">&copy; {{current_year}} {{appName}} Inc.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
