<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Submitted</title>
    <style type="text/css">
        body { margin: 0; padding: 0; min-width: 100%; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #333333; background-color: #F4F7FA; }
        .data-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .data-label { color: #8898aa; width: 40%; }
        .data-val { color: #333333; font-weight: 600; text-align: right; }
        @media (prefers-color-scheme: dark) {
            .body-bg { background-color: #121212 !important; }
            .card-bg { background-color: #1E1E1E !important; border: 1px solid #333333 !important; }
            .text-main { color: #ffffff !important; }
            .text-muted { color: #A0A0A0 !important; }
            .data-row { border-bottom-color: #333 !important; }
            .data-val { color: #e0e0e0 !important; }
        }
    </style>
</head>
<body class="body-bg" style="background-color: #F4F7FA; margin: 0; padding: 0;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" class="body-bg">
        <tr>
            <td align="center" style="padding: 40px 15px;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%;">
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <img src="https://mails.bybata.com/logomail.png" alt="ByBata" width="64" height="64" style="border-radius: 16px; box-shadow: 0 8px 20px rgba(123, 44, 191, 0.15);" />
                        </td>
                    </tr>
                    <tr>
                        <td class="card-bg" bgcolor="#ffffff" style="background-color: #ffffff; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.06); overflow: hidden;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="padding: 40px; text-align: center;">
                                        <h1 class="text-main" style="margin: 0 0 10px; font-size: 24px; font-weight: 900; color: #1a1a1a;">Documents Received</h1>
                                        <p class="text-muted" style="margin: 0 0 20px; font-size: 16px; color: #666;">Hi <strong>{{actorName}}</strong>, your verification documents are under review.</p>
                                        
                                        <div style="background: #F8FAFC; border-radius: 12px; padding: 20px; text-align: left; margin: 20px 0; border-left: 4px solid #7B2CBF;">
                                            <p style="margin: 0; font-weight: 700; color: #333;">Verification ID: {{verificationId}}</p>
                                            <p style="margin: 5px 0 0; font-size: 12px; color: #888;">Type: {{documentType}}</p>
                                        </div>

                                        <p class="text-muted" style="margin: 0; font-size: 14px; color: #666;">This process typically takes 24-48 hours. We will notify you once complete.</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-top: 30px;">
                            <p style="margin: 0; font-size: 12px; color: #999999;">&copy; {{current_year}} ByBata Inc.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
