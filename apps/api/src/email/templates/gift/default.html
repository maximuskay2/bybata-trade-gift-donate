<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift Update</title>
    <style type="text/css">
        body { margin: 0; padding: 0; min-width: 100%; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #333333; background-color: #F4F7FA; }
        .data-row { padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        .data-label { color: #8898aa; width: 40%; }
        .data-val { color: #333333; font-weight: 600; text-align: right; }
        .btn-small { background-color: #E91E63; color: #fff !important; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 12px; }
        @media (prefers-color-scheme: dark) {
            .body-bg { background-color: #121212 !important; }
            .card-bg { background-color: #1E1E1E !important; border: 1px solid #333333 !important; }
            .text-main { color: #ffffff !important; }
            .text-muted { color: #A0A0A0 !important; }
            .data-row { border-bottom-color: #333 !important; }
            .data-val { color: #e0e0e0 !important; }
        }
    </style>
</head>
<body class="body-bg" style="background-color: #F4F7FA; margin: 0; padding: 0;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" class="body-bg">
        <tr>
            <td align="center" style="padding: 40px 15px;">
                <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%;">
                    <tr>
                        <td align="center" style="padding-bottom: 30px;">
                            <img src="https://mails.bybata.com/logomail.png" alt="ByBata" width="64" height="64" style="border-radius: 16px; box-shadow: 0 8px 20px rgba(123, 44, 191, 0.15);" />
                        </td>
                    </tr>
                    <tr>
                        <td class="card-bg" bgcolor="#ffffff" style="background-color: #ffffff; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.06); overflow: hidden;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="padding: 40px;">
                                        <h1 class="text-main" style="margin: 0 0 15px; font-size: 24px; font-weight: 900; color: #E91E63; text-align: center;">Gift Update</h1>
                                        <p class="text-muted" style="margin: 0 0 20px; font-size: 16px; color: #666666; text-align: center;">Hi <strong>{{targetName}}</strong>, here is an update regarding a gift.</p>
                                        
                                        <table width="100%" cellpadding="0" cellspacing="0" style="background: #F8FAFC; border-radius: 12px; padding: 15px;">
                                            {{#if giftTitle}}<tr><td class="data-row"><span class="data-label">Item</span></td><td class="data-row data-val">{{giftTitle}}</td></tr>{{/if}}
                                            {{#if actorName}}<tr><td class="data-row"><span class="data-label">From</span></td><td class="data-row data-val">{{actorName}}</td></tr>{{/if}}
                                            {{#if expiresAt}}<tr><td class="data-row"><span class="data-label">Expires</span></td><td class="data-row data-val">{{expiresAt}}</td></tr>{{/if}}
                                            {{#if giftUrl}}<tr><td class="data-row"><span class="data-label">Action</span></td><td class="data-row data-val"><a href="{{giftUrl}}" class="btn-small">View Gift</a></td></tr>{{/if}}
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-top: 30px;">
                            <p style="margin: 0; font-size: 12px; color: #999999;">&copy; {{current_year}} ByBata Inc.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
