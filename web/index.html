<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="bybata">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>bybata</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
      if (!path) return;
      var segs = path.split('/');
      if (segs[0] !== 'community-invite') return;
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code') || (segs.length > 1 ? segs[1] : '');
      if (!code) return;
      var link = 'bybata://community-invite?code=' + encodeURIComponent(code);
      var banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:12px 16px;background:#0f172a;color:#fff;z-index:9999;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:space-between;';
      banner.innerHTML = '<span>Open invite in Bybata app</span>';
      var btn = document.createElement('a');
      btn.href = link;
      btn.textContent = 'Open App';
      btn.style.cssText = 'color:#0f172a;background:#fff;padding:8px 12px;border-radius:6px;text-decoration:none;font-weight:bold;';
      banner.appendChild(btn);
      document.body.appendChild(banner);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
